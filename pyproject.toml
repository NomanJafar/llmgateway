[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmgateway"
version = "0.1.0"
description = "AI gateway routing across self-hosted and API providers with TTFT SLOs, rate limits, retries and degradation chains"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Noman Jafar", email = "numanjafarshahzad@gmail.com" }]
dependencies = ["httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "tokenbench @ git+https://github.com/NomanJafar/tokenbench"]

[tool.hatch.build.targets.wheel]
packages = ["src/llmgateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.hatch.metadata]
allow-direct-references = true
